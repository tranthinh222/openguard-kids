{% extends "base.html" %} {% block title %}Chi tiết trẻ · OpenGuard Kids{%
endblock %} {% block content %}
<a class="text-decoration-none small" href="/children"
	><i class="bi bi-arrow-left me-1"></i>Danh sách trẻ em</a
>
<div
	class="d-flex flex-wrap justify-content-between align-items-start gap-3 mt-3 mb-4"
>
	<div>
		<h1 id="child-name" class="h3 mb-1">Đang tải...</h1>
		<p class="text-secondary mb-0">
			Policy hiện tại: <span id="policy-version">—</span>
		</p>
	</div>
</div>

<div class="row g-4">
	<div class="col-12 col-xl-8">
		<div class="card border-0 shadow-sm">
			<div class="card-header bg-white border-0 pt-4 px-4">
				<h2 class="h5 mb-0">Thiết bị</h2>
			</div>
			<div id="child-devices" class="card-body p-0">
				<div class="loading-state">
					<div
						class="spinner-border spinner-border-sm"
						role="status"
					></div>
					<span>Đang tải thiết bị...</span>
				</div>
			</div>
		</div>
	</div>

	<div class="col-12 col-xl-4">
		<div class="card border-0 shadow-sm">
			<div class="card-body p-4">
				<h2 class="h5">Ghép thiết bị mới</h2>
				<p class="text-secondary small">
					Mã gồm 8 ký tự và hết hạn sau 10 phút.
				</p>
				<button
					id="create-enrollment-button"
					class="btn btn-primary w-100"
					type="button"
				>
					<i class="bi bi-link-45deg me-2"></i>Tạo mã ghép đôi
				</button>
				<div id="enrollment-panel" class="mt-3"></div>
			</div>
		</div>
	</div>
</div>
{% endblock %}
