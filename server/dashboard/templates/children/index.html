{% extends "base.html" %} {% block title %}Trẻ em · OpenGuard Kids{% endblock %}
{% block content %}
<div
  class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4"
>
  <div>
    <h1 id="children-page-title" class="h3 mb-1">Trẻ em</h1>
    <p id="children-page-description" class="text-secondary mb-0">
      Quản lý hồ sơ và các thiết bị đã ghép đôi.
    </p>
  </div>
  <div id="children-page-actions">
    <a id="add-child-button" class="btn btn-primary" href="/children/new"
      ><i class="bi bi-person-plus me-2"></i>Thêm trẻ</a
    >
  </div>
</div>

<div id="children-grid" class="row g-3">
  <div class="col-12">
    <div class="loading-state card border-0 shadow-sm">
      <div class="spinner-border spinner-border-sm" role="status"></div>
      <span>Đang tải danh sách...</span>
    </div>
  </div>
</div>
{% endblock %}
