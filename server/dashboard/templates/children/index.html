{% extends "base.html" %} {% block title %}Trẻ em · OpenGuard Kids{% endblock %}
{% block content %}
<div
	class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4"
>
	<div>
		<h1 class="h3 mb-1">Trẻ em</h1>
		<p class="text-secondary mb-0">
			Quản lý hồ sơ và các thiết bị đã ghép đôi.

	<a class="btn btn-primary" href="/children/new"
