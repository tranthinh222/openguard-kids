<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}OpenGuard Kids{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/assets/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="/static/css/app.css" rel="stylesheet" />
  </head>
  <body
    data-page="{{ page_name|default('') }}"
    {%
    if
    child_id
    is
    defined
    %}data-child-id="{{ child_id }}"
    {%
    endif
    %}
    {%
    if
    login_csrf
    is
    defined
    %}data-login-csrf="{{ login_csrf }}"
    {%
    endif
    %}
  >
    {% if show_nav %}
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand fw-semibold" href="/dashboard">
          <i class="bi bi-shield-check me-2"></i>OpenGuard Kids
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Mở menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto ms-lg-4">
            <li class="nav-item">
              <a
                class="nav-link{{ ' active' if page_name == 'dashboard' else '' }}"
                href="/dashboard"
                >Tổng quan</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link{{ ' active' if page_name in ['children', 'child-detail', 'child-create'] else '' }}"
                href="/children"
                >Trẻ em</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link{{ ' active' if page_name in ['policies', 'policy-detail'] else '' }}"
                href="/policies"
                >Chính sách</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link{{ ' active' if page_name == 'requests' else '' }}"
                href="/requests"
                >Yêu cầu</a
              >
            </li>
            <li class="nav-item">
              <span
                class="nav-link disabled"
                title="Sẽ triển khai ở Week 03"
                aria-disabled="true"
                >Báo cáo</span
              >
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
            <span id="parent-email" class="text-secondary small"
              >Đang tải...</span
            >
            <button
              id="logout-button"
              class="btn btn-outline-secondary btn-sm"
              type="button"
            >
              Đăng xuất
            </button>
          </div>
        </div>
      </div>
    </nav>
    {% endif %}

    <main class="container-fluid px-3 px-lg-4 py-4">
      <div id="global-alert" class="d-none alert" role="alert"></div>
      <div
        id="live-refresh-status"
        class="d-none"
        role="status"
        aria-live="polite"
      ></div>
      {% block content %}{% endblock %}
    </main>

    <div
      id="toast-region"
      class="toast-region"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
